name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint and formatting
        run: npm run lint

      - name: Type check and build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: docker compose up -d --wait

      # --wait returns once the containers are running, but the entrypoints
      # still migrate before serving, and the services have no healthcheck
      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:5000/api/v1/token; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:5001/api/v1/route; do sleep 2; done'

      - name: Run integration tests
        run: npm run test:integration

      - name: Check API types are up to date
        run: npm run check:api-types

      - name: Show service logs
        if: failure()
        run: docker compose logs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t wormhole-ui .

      - name: Start container
        run: docker run -d --name wormhole-ui -p 8080:8080 wormhole-ui

      # /health doesn't touch the built assets, and the base image ships its own
      # index.html, so check that / is the app's page
      - name: Check the container serves the UI
        run: |
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8080/health; do sleep 1; done'
          curl -fsS http://localhost:8080/ | grep -q '<title>Wormhole</title>'

      - name: Show container logs
        if: failure()
        run: docker logs wormhole-ui
